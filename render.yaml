databases:
  - name: divvyup-db
    databaseName: divvyup
    user: divvyup_user
    plan: free

services:
  - type: web
    name: divvyup-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: divvyup-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false  # Set to: ["https://<your-frontend-name>.onrender.com"]

  - type: web
    name: divvyup-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to: https://divvyup-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
