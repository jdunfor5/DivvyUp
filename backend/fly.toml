app = 'divvyup-backend'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 2

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
